name: Qt None refcount and Python 3.12 comparison

on:
  push:
    branches: ['gpt/tema-diag']
  workflow_dispatch:

jobs:
  refcount:
    name: Python 3.11 None refcount probes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: ${{ github.workspace }}/ingetrazo:${{ github.workspace }}/plugin
    steps:
      - uses: actions/checkout@v4
        with: {path: plugin}
      - uses: actions/checkout@v4
        with: {repository: ingelibre/ingetrazo, path: ingetrazo}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Qt runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libopengl0 libxkbcommon0
          python -m pip install -q 'PySide6>=6.9,<7' 'numpy>=1.26,<3'
      - name: Isolate each PySide6 operation (one call and 64 calls per process)
        working-directory: plugin
        run: |
          set +e
          for op in pixmap moveTo lineTo cubicTo quadTo closeSubpath addRect addEllipse drawPath setPen QPen setCapStyle setJoinStyle setColor fill fromImage setRenderHint scale setBrush; do
            for n in 1 64; do
              echo "::group::refcount $op ($n calls)"
              python -X faulthandler scripts/diag/d_pixmap.py --operation "$op" --repeats "$n"
              result=$?
              echo "EXIT operation=$op n=$n code=$result"
              echo "::endgroup::"
              if [ "$result" -ne 0 ]; then
                echo "::error title=refcount $op ($n calls)::exit $result"
              fi
            done
          done
          exit 0

  python312:
    name: Python 3.12 672 pixmaps
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: ${{ github.workspace }}/ingetrazo:${{ github.workspace }}/plugin
    steps:
      - uses: actions/checkout@v4
        with: {path: plugin}
      - uses: actions/checkout@v4
        with: {repository: ingelibre/ingetrazo, path: ingetrazo}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Qt runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libopengl0 libxkbcommon0
          python -m pip install -q 'PySide6>=6.9,<7' 'numpy>=1.26,<3'
      - name: Generate 672 pixmaps and record exit code
        working-directory: plugin
        run: |
          set +e
          python -X faulthandler scripts/diag/d_pixmap.py --volume
          code=$?
          echo "::notice title=Python 3.12 672 pixmaps::exit code $code"
          echo "Python 3.12 volume exit code: $code" >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
