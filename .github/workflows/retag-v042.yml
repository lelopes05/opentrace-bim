name: Point v0.42.0 tag to published source
on:
  push:
    branches:
      - release/0.42.0-prep
    paths:
      - .github/workflows/retag-v042.yml
permissions:
  contents: write
jobs:
  move-tag:
    if: github.repository == 'lelopes05/opentrace-bim'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.42.0-prep
          fetch-depth: 0
          persist-credentials: true
      - name: Verify source and move only matching v0.42.0 tag
        shell: bash
        run: |
          set -euo pipefail
          TARGET='33a4b3c9ee47e3e96bea66b958ef20e5f1fe5c5d'
          PREVIOUS='0d93dead9343de9b2a517321bb7e420a6aa154c5'
          git fetch origin main --no-tags
          git cat-file -e "$TARGET^{commit}"
          git show "$TARGET:OpenTrace_BIM/__init__.py" | grep -Eq '__version__[[:space:]]*=[[:space:]]*"0\.42\.0"'
          OLD="$(git ls-remote --refs origin refs/tags/v0.42.0 | cut -f1)"
          if [[ "$OLD" == "$TARGET" ]]; then
            echo "v0.42.0 already points to published source"
            exit 0
          fi
          if [[ "$OLD" != "$PREVIOUS" ]]; then
            echo "Unexpected tag state, refusing tag overwrite: $OLD"
            exit 1
          fi
          git tag --force v0.42.0 "$TARGET"
          git push --force-with-lease=refs/tags/v0.42.0:"$OLD" origin refs/tags/v0.42.0
          echo "Updated v0.42.0 tag from $OLD to $TARGET"
