name: IngeTrazo Android GPU Lab APK
on:
  push:
    branches: [android-ingetrazo-renderers]
    paths:
      - 'android/renderer-lab/**'
      - '.github/workflows/android-renderer-lab.yml'
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile diagnostic APK
        working-directory: android/renderer-lab
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ingetrazo-gpu-lab-apk
          path: android/renderer-lab/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
