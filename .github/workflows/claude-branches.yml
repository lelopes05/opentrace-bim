name: Agent branches — tests, benchmark and test package

on:
  push:
    branches: ['claude/**', 'gpt/**']
  workflow_dispatch:

env:
  BASE_REF: a1c49aa66eb93bbb9fa74e6b03d4065dc9f70334

jobs:
  test:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: {path: plugin}
      - uses: actions/checkout@v4
        with: {path: base, ref: '${{ env.BASE_REF }}'}
      - uses: actions/checkout@v4
        with: {repository: ingelibre/ingetrazo, path: ingetrazo}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Qt runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libopengl0 libxkbcommon0
          python -m pip install -q 'PySide6>=6.9,<7' 'numpy>=1.26,<3'
      - name: Pure tests
        working-directory: plugin
        run: |
          python -m compileall -q OpenTrace_BIM
          python -m unittest discover -s tests
      - name: Host tests
        working-directory: plugin
        env:
          PYTHONPATH: ${{ github.workspace }}/ingetrazo:${{ github.workspace }}/plugin
          QT_QPA_PLATFORM: offscreen
        # Failures are also emitted as annotations, readable without log access.
        run: |
          set +e
          # Each host-test file gets its own process AND its own failure report.
          # Never hide an earlier failure behind a later successful file's tail.
          status=0
          : > host.txt
          for f in tests_host/test_*.py; do
            python -X faulthandler -m unittest discover -s tests_host -p "$(basename "$f")" -v 2> host_case.txt
            result=$?
            cat host_case.txt >> host.txt
            if [ $result -ne 0 ]; then
              status=1
              echo "::group::Failed $f"
              cat host_case.txt
              echo "::endgroup::"
              python - "$f" <<'PY'
          import sys
          content = open("host_case.txt").read()[-3000:]
          message = content.replace("%", "%25").replace("\n", "%0A")
          print("::error title=host test " + sys.argv[1] + "::" + message)
          PY
            fi
          done
          tail -5 host.txt
          exit $status
      - name: Publish i18n audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i18n-report-${{ github.run_number }}
          path: plugin/i18n_report.md
          if-no-files-found: ignore
          retention-days: 30
      - id: icon_sheet
        name: Upload icon review sheet
        uses: actions/upload-artifact@v4
        with:
          name: OpenTrace_BIM-ICONS-${{ github.run_number }}
          path: plugin/docs/icons_sheet.png
          if-no-files-found: error
          retention-days: 30
      - name: Icon sheet link
        run: echo "::notice title=Folha de ícones::${{ steps.icon_sheet.outputs.artifact-url }}"
      - name: Benchmark against the base revision
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          for rev in base plugin; do
            echo "== $rev =="
            out=$(PYTHONPATH="$GITHUB_WORKSPACE/ingetrazo:$GITHUB_WORKSPACE/$rev" \
              python plugin/tests_host/bench_curved_walls.py)
            echo "$out" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::notice title=benchmark $rev::$(echo "$out" | tr '\n' ' ')"
          done

  package:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Stage the plugin folder
        run: |
          mkdir installable
          rsync -a --exclude '__pycache__' --exclude '*.pyc' OpenTrace_BIM installable/
          echo "Revision: $GITHUB_SHA ($GITHUB_REF_NAME) — test build, not a release" \
            > installable/OpenTrace_BIM/TEST_BUILD.txt
      - id: upload
        uses: actions/upload-artifact@v4
        with:
          name: OpenTrace_BIM-TEST-${{ github.run_number }}
          path: installable/
          if-no-files-found: error
          retention-days: 30
      - name: Download link
        run: echo "::notice title=Download do pacote de teste::${{ steps.upload.outputs.artifact-url }}"
