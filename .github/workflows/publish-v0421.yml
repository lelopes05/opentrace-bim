name: Publish OpenTrace BIM v0.42.1 Alpha
on:
  push:
    branches:
      - fix/updater-github-releases-v0.42.1
    paths:
      - .github/workflows/publish-v0421.yml
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'lelopes05/opentrace-bim'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Rebuild manifest and run updater regression checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_updater_release_feed.py -v
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          root = Path("OpenTrace_BIM")
          files = sorted(x for x in root.rglob("*") if x.is_file() and x.name != "PACKAGE_MANIFEST.txt" and x.suffix != ".pyc" and "__pycache__" not in x.parts)
          assert len(files) >= 150, f"Unexpectedly small plugin: {len(files)}"
          for f in files:
              if f.suffix == ".py":
                  compile(f.read_bytes(), str(f), "exec")
          assert '__version__ = "0.42.1"' in (root / "__init__.py").read_text()
          manifest = "\n".join(sha256(f.read_bytes()).hexdigest() + "  " + f.relative_to(root).as_posix() for f in files) + "\n"
          (root / "PACKAGE_MANIFEST.txt").write_text(manifest, encoding="utf-8")
          print("PASS:", len(files), "package files")
          PY
          git add OpenTrace_BIM/PACKAGE_MANIFEST.txt
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh v0.42.1 Alpha package SHA-256 manifest'
            git push origin HEAD:refs/heads/main
          fi
      - name: Package and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARGET="$(git rev-parse HEAD)"
          MAIN="$(git ls-remote --refs origin refs/heads/main | cut -f1)"
          [[ "$TARGET" == "$MAIN" ]] || { echo "Main moved unexpectedly"; exit 1; }
          FILE="$RUNNER_TEMP/OpenTrace_BIM-v0.42.1.zip"
          zip -q -r "$FILE" OpenTrace_BIM -x '*/__pycache__/*' '*.pyc'
          unzip -t -q "$FILE"
          python3 - "$FILE" <<'PY'
          import sys, zipfile
          from pathlib import Path
          with zipfile.ZipFile(sys.argv[1]) as zf:
              names = [x.filename for x in zf.infolist() if not x.is_dir()]
              assert all(name.startswith('OpenTrace_BIM/') for name in names)
              assert len(names) <= 500
              assert b'__version__ = "0.42.1"' in zf.read('OpenTrace_BIM/__init__.py')
              print('Archive entries:', len(names))
          assert Path(sys.argv[1]).stat().st_size < 10 * 1024 * 1024
          PY
          sha256sum "$FILE"
          if gh release view v0.42.1 --repo lelopes05/opentrace-bim >/dev/null 2>&1; then
            echo "Release already exists; refusing to alter existing release"
            exit 1
          fi
          gh release create v0.42.1 "$FILE" \
            --target "$TARGET" \
            --title "OpenTrace BIM v0.42.1 — Alpha" \
            --notes-file docs/releases/v0.42.1/RELEASE_NOTES.md \
            --prerelease \
            --repo lelopes05/opentrace-bim
          echo "Published at main SHA $TARGET"
